name: resilient_web_bootstrap_for_flutter
description: CLI tooling that installs and packages a hardened Flutter web bootstrap.
version: 0.1.0
homepage: https://github.com/Alexqwesa/resilient_web_bootstrap_for_flutter
repository: https://github.com/Alexqwesa/resilient_web_bootstrap_for_flutter
issue_tracker: https://github.com/Alexqwesa/resilient_web_bootstrap_for_flutter/issues
topics:
  - flutter
  - web
  - cli
  - bootstrap
  - caching

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  args: ^2.7.0
  crypto: ^3.0.6
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3

executables:
  resilient_bootstrap: resilient_bootstrap
